
name: SchiggyChat Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build SchiggyChat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Parent Maven Project
        id: project
        run: |
          echo "Repository-Inhalt:"
          ls -la

          POM="./schiggysmp-1-von-3/pom.xml"

          if [ ! -f "$POM" ]; then
            echo "Übergeordnete pom.xml nicht gefunden!"
            find . -name pom.xml -not -path '*/target/*'
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Verwende: $POM"

      - name: Build with Maven
        run: |
          mvn -B clean package \
            -f "${{ steps.project.outputs.pom }}" \
            -pl schiggy-stats \
            -am

      - name: Find Plugin JAR
        id: jar
        run: |
          JAR=$(find ./schiggysmp-1-von-3 \
            -path '*/target/*.jar' \
            -not -name 'original-*.jar' \
            -not -name '*-sources.jar' \
            -not -name '*-javadoc.jar' \
            | grep '/schiggy-stats/' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Keine Stats-JAR gefunden!"
            find ./schiggysmp-1-von-3 -type f
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Gefunden: $JAR"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SchiggyStats
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
