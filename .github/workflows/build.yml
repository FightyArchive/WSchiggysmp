```yaml
name: SchiggyChat Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build SchiggyChat
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Maven Project
        id: project
        run: |
          POM=$(find ./schiggysmp-1-von-2 \
            -name pom.xml \
            -not -path '*/target/*' \
            | head -n 1)

          if [ -z "$POM" ]; then
            echo "Keine pom.xml in schiggysmp-1-von-2 gefunden!"
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Maven-Projekt: $POM"

      - name: Build with Maven
        run: mvn -B clean package -f "${{ steps.project.outputs.pom }}"

      - name: Find Plugin JAR
        id: jar
        run: |
          JAR=$(find ./schiggysmp-1-von-2 \
            -path '*/target/*.jar' \
            -not -name 'original-*.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "Keine Plugin-JAR gefunden!"
            find ./schiggysmp-1-von-2 -type f
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Gefundene JAR: $JAR"

      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SchiggyChat-2.0.0
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
```
