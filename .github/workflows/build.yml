
name: SchiggySMP Full Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build All SchiggySMP Plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Find Parent POM
        id: project
        run: |
          POM="./schiggysmp-1-von-3/pom.xml"

          if [ ! -f "$POM" ]; then
            echo "Parent-POM nicht gefunden!"
            find . -name pom.xml -not -path '*/target/*'
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"

      - name: Build All Modules
        run: |
          mvn -B clean package \
            -f "${{ steps.project.outputs.pom }}" \
            -DskipTests

      - name: Collect All Plugin JARs
        run: |
          mkdir -p build-artifacts

          find ./schiggysmp-1-von-3 \
            -path '*/target/*.jar' \
            -not -name 'original-*.jar' \
            -not -name '*-sources.jar' \
            -not -name '*-javadoc.jar' \
            -exec cp {} build-artifacts/ \;

          if [ -z "$(ls -A build-artifacts)" ]; then
            echo "Keine JAR-Dateien gefunden!"
            exit 1
          fi

          echo "Gebaut wurden:"
          ls -lh build-artifacts

      - name: Upload All Plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: SchiggySMP-ALL-PLUGINS
          path: build-artifacts/*.jar
          if-no-files-found: error
