prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Dir wurde nichts berechnet."
reloaded: "{prefix}<green>SchiggyAuction wurde neu geladen."
usage: "{prefix}<gray>Benutzung: <white>/ah</white><gray>, <white>/ah sell [Preis]</white><gray>, <white>/ah search [Text]</white> <gray>oder <white>/ah mine"

# ---------------- Verkaufen ----------------
sell-usage: "{prefix}<gray>Benutzung: <white>/ah sell [Preis]</white> <gray>mit dem Item in der Hand."
sell-hold-item: "{prefix}<red>Du musst das Item, das du verkaufen willst, in der Hand halten."
sell-invalid-price: "{prefix}<red>Ungültiger Preis. Beispiele: <white>500</white>, <white>2.5k</white>, <white>1m</white>"
sell-price-range: "{prefix}<red>Der Preis muss zwischen <white>{min}</white> und <white>{max}</white> liegen."
sell-blacklisted: "{prefix}<red>Dieses Item darf nicht versteigert werden."
sell-limit: "{prefix}<red>Du hast schon <white>{limit}</white> aktive Auktionen. Beende oder warte, bis eine abläuft."
sell-success: "{prefix}<green>Auktion erstellt: <white>{amount}x {item}</white> <gray>für <green>{price}</green> <dark_gray>(Gebühr bei Verkauf: {fee}%, läuft {duration} lang)"

# ---------------- Kaufen ----------------
bought: "{prefix}<green>Gekauft: <white>{amount}x {item}</white> <gray>für <green>{price}</green>."
sold-notify: "{prefix}<white>{buyer}</white> <gray>hat deine Auktion <white>{amount}x {item}</white> gekauft. Du erhältst <green>{payout}</green> <dark_gray>(Gebühr {fee})"
not-enough-money: "{prefix}<red>Du hast nicht genug Geld. Der Preis beträgt <white>{price}</white>."
inventory-full: "{prefix}<red>Dein Inventar hat nicht genug Platz für dieses Item."
listing-gone: "{prefix}<red>Diese Auktion gibt es nicht mehr (verkauft oder abgelaufen)."
own-listing: "{prefix}<red>Das ist deine eigene Auktion. Verwalte sie unter <white>Deine Auktionen</white>."

# ---------------- Verwalten ----------------
cancelled: "{prefix}<gray>Auktion abgebrochen. Hole dein Item unter <white>Deine Auktionen</white> ab."
cancel-failed: "{prefix}<red>Diese Auktion konnte nicht abgebrochen werden."
claimed: "{prefix}<green>Item abgeholt."
claim-failed: "{prefix}<red>Dieses Item kann nicht (mehr) abgeholt werden."
search-hint: "{prefix}<gray>Suche mit <white>/ah search [Text]</white> <gray>(z. B. <white>/ah search diamond</white>)."
search-set: "{prefix}<gray>Suche: <white>{text}"
search-prompt: "{prefix}<gray>Schreibe den Suchbegriff in den Chat. <dark_gray>(<white>cancel</white> zum Abbrechen)"

# ---------------- Menü ----------------
gui-auction-title: "<dark_gray><underlined>Auktionshaus <gray>(Seite {page}/{pages})"
gui-auction-mine-title: "<dark_gray><underlined>Deine Auktionen"
gui-auction-confirm-title: "<dark_gray><underlined>Kauf bestätigen"

gui-listing-lore:
  - "<gray>Verkäufer: <white>{seller}"
  - "<gray>Preis: <green><bold>{price}"
  - "<gray>Läuft noch: <white>{time}"
  - ""
  - "<yellow>Klicke zum Kaufen"
gui-mine-active-lore:
  - "<gray>Preis: <green>{price}"
  - "<gray>Läuft noch: <white>{time}"
  - ""
  - "<yellow>Linksklick: <white>Auktion abbrechen"
