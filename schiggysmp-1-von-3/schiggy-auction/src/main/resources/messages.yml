  - "<gray>Preis: <green>{price}"
  - "<red>Abgelaufen"
  - ""
  - "<yellow>Klicke zum Abholen"
gui-mine-cancelled-lore:
  - "<gray>Preis: <green>{price}"
  - "<red>Abgebrochen"
  - ""
  - "<yellow>Klicke zum Abholen"

gui-mine-name: "<gold><bold>Deine Auktionen"
gui-mine-lore:
  - "<gray>Verwalte deine Auktionen und"
  - "<gray>hole abgelaufene Items ab."
