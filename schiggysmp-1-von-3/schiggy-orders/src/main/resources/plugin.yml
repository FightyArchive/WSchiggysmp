name: SchiggyOrders
version: '${project.version}'
main: de.schiggy.orders.SchiggyOrders
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore, SchiggyEconomy]
softdepend: [SchiggySettings, SchiggyWorth]
authors: [FightyFinn]
description: Auftragsmarkt - Spieler suchen Items, andere liefern gegen Bezahlung (/order)
commands:
  order:
    description: Öffnet den Auftragsmarkt
    aliases: [orders, auftrag]
permissions:
  schiggy.orders.use:
    description: Auftragsmarkt benutzen
    default: true
  schiggy.orders.admin:
    description: /order reload benutzen
    default: op
