prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Deine Items bzw. dein Geld wurden zurückgegeben."
reloaded: "{prefix}<green>SchiggyOrders wurde neu geladen."
usage: "{prefix}<gray>Benutzung: <white>/order</white><gray>, <white>/order create [Menge] [Preis pro Stück] [Item]</white><gray>, <white>/order search [Text]</white> <gray>oder <white>/order mine"

# ---------------- Order erstellen ----------------
create-usage: "{prefix}<gray>Benutzung: <white>/order create [Menge] [Preis pro Stück] [Item]</white> <gray>(ohne Item: das Item in deiner Hand)"
create-no-item: "{prefix}<red>Halte ein Item in der Hand oder gib einen Item-Namen an."
create-unknown-item: "{prefix}<red>Unbekanntes Item: <white>{item}</white>"
create-blacklisted: "{prefix}<red>Dieses Item darf nicht bestellt werden."
create-invalid-amount: "{prefix}<red>Ungültige Menge. Erlaubt: <white>1</white> bis <white>{max}</white>."
create-invalid-price: "{prefix}<red>Ungültiger Preis. Beispiele: <white>10</white>, <white>2.5</white>, <white>1k</white>"
create-price-range: "{prefix}<red>Der Preis pro Stück muss zwischen <white>{min}</white> und <white>{max}</white> liegen."
create-limit: "{prefix}<red>Du hast schon <white>{limit}</white> aktive Orders."
create-no-money: "{prefix}<red>Du hast nicht genug Geld. Die Order kostet <white>{total}</white>."
create-success: "{prefix}<green>Order erstellt: <white>{amount}x {item}</white> <gray>für je <green>{unit}</green> <dark_gray>(insgesamt {total} reserviert, läuft {duration})"

# ---------------- Liefern ----------------
own-order: "{prefix}<red>Das ist deine eigene Order. Verwalte sie unter <white>Deine Orders</white>."
no-items: "{prefix}<red>Du hast kein unverändertes <white>{item}</white> im Inventar."
order-gone: "{prefix}<red>Diese Order hat sich geändert oder ist nicht mehr offen. Deine Items wurden zurückgegeben."
fulfilled: "{prefix}<green>Geliefert: <white>{amount}x {item}</white> <gray>für <green>{payout}</green> <dark_gray>(Gebühr {fee})"
filled-notify: "{prefix}<white>{player}</white> <gray>hat <white>{amount}x {item}</white> für deine Order geliefert. Hole sie unter <white>Deine Orders</white> ab."

# ---------------- Verwalten ----------------
cancelled: "{prefix}<gray>Order abgebrochen. Zurückerstattet: <green>{refund}</green>"
cancel-failed: "{prefix}<red>Diese Order kann nicht abgebrochen werden."
claimed: "{prefix}<green><white>{amount}x {item}</white> abgeholt."
claim-failed: "{prefix}<red>Hier gibt es nichts abzuholen."
expired-notify: "{prefix}<gray>Deine Order für <white>{item}</white> ist abgelaufen. Zurückerstattet: <green>{refund}</green>"
search-hint: "{prefix}<gray>Suche mit <white>/order search [Text]</white> <gray>(z. B. <white>/order search cactus</white>)."
search-prompt: "{prefix}<gray>Schreibe den Suchbegriff in den Chat. <dark_gray>(<white>cancel</white> zum Abbrechen)"
search-set: "{prefix}<gray>Suche: <white>{text}"

