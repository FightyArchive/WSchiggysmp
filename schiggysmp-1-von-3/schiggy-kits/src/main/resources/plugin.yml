name: SchiggyKits
version: '${project.version}'
main: de.schiggy.kits.SchiggyKits
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore]
authors: [FightyFinn]
description: Kits, die du direkt im Spiel erstellst und bearbeitest (/kit)
commands:
  kit:
    description: Öffnet das Kit-Menü oder holt ein Kit ab
    aliases: [kits]
permissions:
  schiggy.kit.use:
    description: /kit benutzen
    default: true
  schiggy.kit.admin:
    description: Kits erstellen, ändern und löschen
    default: op
  schiggy.kit.bypass-cooldown:
    description: Keine Wartezeit zwischen Kits
    default: op
