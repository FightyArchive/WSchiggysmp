prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten."
load-failed: "<red>Deine Kit-Daten konnten nicht geladen werden. Bitte versuche es gleich noch einmal."
reloaded: "{prefix}<green>SchiggyKits wurde neu geladen (<white>{count}</white> Kits)."

kit-unknown: "{prefix}<red>Das Kit <white>{kit}</white> gibt es nicht."
kit-no-access: "{prefix}<red>Du darfst das Kit <white>{kit}</white> nicht benutzen."
kit-cooldown: "{prefix}<red>Du kannst das Kit <white>{kit}</white> erst in <white>{time}</white> wieder abholen."
kit-received: "{prefix}<green>Du hast das Kit <white>{kit}</white> erhalten."
kit-given: "{prefix}<gray>Das Kit <white>{kit}</white> wurde an <white>{player}</white> gegeben."
player-offline: "{prefix}<red>Der Spieler ist nicht online."

# ---------------- Admin ----------------
admin-usage:
  - "{prefix}<gold>Kit-Befehle für Admins:"
  - "<gray> <white>/kit create [Name] [Wartezeit]</white> <dark_gray>- Kit aus deinem Inventar erstellen"
  - "<gray> <white>/kit update [Name]</white> <dark_gray>- Inhalt mit deinem Inventar überschreiben"
  - "<gray> <white>/kit delete [Name]</white> <dark_gray>- Kit löschen"
  - "<gray> <white>/kit cooldown [Name] [Zeit]</white> <dark_gray>- z. B. 30m, 12h, 1d, 0 = keine"
  - "<gray> <white>/kit icon [Name]</white> <dark_gray>- Item in der Hand als Symbol"
  - "<gray> <white>/kit display [Name] [Text]</white> <dark_gray>- Anzeigename (Farben mit MiniMessage)"
  - "<gray> <white>/kit effect [Name] add [Effekt] [Sekunden] [Stufe]</white> <dark_gray>- Effekt beim Abholen"
  - "<gray> <white>/kit effect [Name] clear</white> <dark_gray>- alle Effekte entfernen"
  - "<gray> <white>/kit give [Spieler] [Name]</white> <dark_gray>- Kit ohne Wartezeit geben"
  - "<gray> <white>/kit preview [Name]</white> <dark_gray>- Inhalt ansehen"
  - "<gray> <white>/kit reload</white>"
invalid-name: "{prefix}<red>Ungültiger Name. Erlaubt sind Buchstaben, Zahlen, <white>_</white> und <white>-</white> (maximal 16 Zeichen)."
invalid-time: "{prefix}<red>Ungültige Zeit. Beispiele: <white>30m</white>, <white>12h</white>, <white>1d</white>, <white>0</white>"
invalid-effect: "{prefix}<red>Unbekannter Effekt <white>{effect}</white>. Beispiele: speed, strength, regeneration, resistance."
invalid-number: "{prefix}<red>Sekunden und Stufe müssen Zahlen sein."
empty-inventory: "{prefix}<red>Dein Inventar ist leer - es gibt nichts, was ins Kit kommen könnte."
kit-exists: "{prefix}<red>Das Kit <white>{kit}</white> gibt es schon. Nutze <white>/kit update {kit}</white>."
kit-created: "{prefix}<green>Kit <white>{kit}</white> erstellt (<white>{count}</white> Stacks)."
kit-updated: "{prefix}<green>Kit <white>{kit}</white> aktualisiert (<white>{count}</white> Stacks)."
kit-deleted: "{prefix}<gray>Kit <white>{kit}</white> <red>gelöscht</red>."
kit-cooldown-set: "{prefix}<gray>Wartezeit von <white>{kit}</white>: <white>{time}"
kit-icon-set: "{prefix}<gray>Symbol von <white>{kit}</white> geändert."
kit-icon-none: "{prefix}<red>Halte ein Item in der Hand."
kit-display-set: "{prefix}<gray>Anzeigename von <white>{kit}</white> geändert."
kit-effect-added: "{prefix}<gray>Effekt <white>{effect}</white> zu <white>{kit}</white> hinzugefügt."
kit-effects-cleared: "{prefix}<gray>Alle Effekte von <white>{kit}</white> entfernt."

