# SchiggyBounty

# Kleinster und groesster Betrag, den man auf einmal als Kopfgeld setzen darf (normale Einheiten)
min-amount: 1000
max-amount: 1000000000

# Gebuehr in Prozent, die dem Moerder vom Kopfgeld abgezogen wird (0 = keine)
claim-fee-percent: 10

# Neue Kopfgelder allen Spielern im Chat zeigen
announce-new: true

# Kopfgelder, die nach so vielen Tagen noch nicht eingeloest wurden, laufen ab und werden zurueckgezahlt
# (0 = laufen nie ab)
expire-days: 0
