prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Dir wurde nichts berechnet."
usage: "{prefix}<gray>Benutzung: <white>/bounty</white><gray>, <white>/bounty set [Spieler] [Betrag]</white> <gray>oder <white>/bounty check [Spieler]"
player-unknown: "{prefix}<red>Der Spieler <white>{player}</white> ist unbekannt."
invalid-amount: "{prefix}<red>Ungültiger Betrag. Beispiele: <white>5000</white>, <white>25k</white>, <white>1m</white>"
amount-range: "{prefix}<red>Das Kopfgeld muss zwischen <white>{min}</white> und <white>{max}</white> liegen."
self: "{prefix}<red>Du kannst kein Kopfgeld auf dich selbst setzen."
no-money: "{prefix}<red>Du hast nicht genug Geld. Du brauchst <white>{amount}</white>."

placed: "{prefix}<green>Du hast <white>{amount}</white> <green>Kopfgeld auf <white>{player}</white> <green>gesetzt. Insgesamt: <white>{total}"
announce: "{prefix}<white>{placer}</white> <gray>hat ein Kopfgeld von <green>{amount}</green> <gray>auf <white>{player}</white> <gray>gesetzt! <dark_gray>(insgesamt {total})"
you-were-targeted: "{prefix}<red>Auf dich wurde ein Kopfgeld von <white>{amount}</white> <red>gesetzt!"
check: "{prefix}<gray>Auf <white>{player}</white> <gray>liegt ein Kopfgeld von <green>{total}</green>."
check-none: "{prefix}<white>{player}</white> <gray>hat kein Kopfgeld."
claimed: "{prefix}<green>Du hast das Kopfgeld auf <white>{player}</white> <green>erhalten: <white>{payout}</white> <dark_gray>(Gebühr {fee})"
claimed-broadcast: "{prefix}<white>{killer}</white> <gray>hat das Kopfgeld von <green>{total}</green> <gray>auf <white>{player}</white> <gray>kassiert!"
lost: "{prefix}<red>Du wurdest von <white>{killer}</white> getötet. Das Kopfgeld auf dich ist weg."
expired: "{prefix}<gray>Dein Kopfgeld auf <white>{player}</white> ist abgelaufen. Zurückerstattet: <green>{amount}</green>"

gui-title: "<dark_gray><underlined>Kopfgelder"
gui-head-name: "<red><bold>{player}"
gui-head-lore:
  - "<gray>Kopfgeld: <green><bold>{total}"
  - "<gray>Gesetzt von: <white>{count} Spieler"
  - ""
  - "<yellow>Töte ihn, um das Kopfgeld zu bekommen!"
gui-empty: "<gray><bold>Aktuell gibt es keine Kopfgelder"
gui-info-name: "<gold><bold>So funktioniert es"
gui-info-lore:
  - "<gray>Setze mit <white>/bounty set [Spieler] [Betrag]</white>"
  - "<gray>ein Kopfgeld auf einen Spieler."
  - "<gray>Wer ihn tötet, bekommt das Geld."
