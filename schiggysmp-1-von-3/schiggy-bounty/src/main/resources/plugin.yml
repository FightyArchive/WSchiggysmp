name: SchiggyBounty
version: '${project.version}'
main: de.schiggy.bounty.SchiggyBounty
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore, SchiggyEconomy]
authors: [FightyFinn]
description: Kopfgeld-System - setze ein Kopfgeld auf Spieler, wer sie tötet, bekommt es (/bounty)
commands:
  bounty:
    description: Kopfgelder ansehen und setzen
    aliases: [bounties, kopfgeld]
permissions:
  schiggy.bounty.use:
    description: /bounty benutzen
    default: true
