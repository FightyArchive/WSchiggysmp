prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Deine Items wurden zurückgegeben."
load-failed: "<red>Deine Verkaufsdaten konnten nicht geladen werden. Bitte versuche es gleich noch einmal."

sold: "{prefix}<green>Verkauft! <gray>{items} Items für <green>{amount}</green> <dark_gray>(Multiplikator x{multiplier})"
nothing-sellable: "{prefix}<red>Es gab nichts zu verkaufen. Deine Items wurden zurückgegeben."
returned: "{prefix}<gray>Nicht verkaufbare Items wurden dir zurückgegeben."
hand-empty: "{prefix}<red>Du hältst nichts in der Hand, das sich verkaufen lässt."
none-in-inventory: "{prefix}<red>In deinem Inventar ist nichts, das sich verkaufen lässt."
sell-limit: "{prefix}<red>Dein Kontostand würde das Limit überschreiten. Deine Items wurden zurückgegeben."
level-up: "{prefix}<gold><bold>Level-Up!</bold> <gray>Du bist jetzt Verkaufs-Level <white>{level}</white> <dark_gray>(Multiplikator x{multiplier})"

stats-header: "{prefix}<gold>Deine Verkaufs-Statistik"
stats-line-level: "<gray> Level: <white>{level} <dark_gray>(Multiplikator x{multiplier})"
stats-line-earned: "<gray> Verdient durch Verkäufe: <green>{earned}"
stats-line-next: "<gray> Bis zum nächsten Level: <green>{next}"
stats-line-max: "<gray> Du hast das höchste Level erreicht."

# ---------------- Menü /sell ----------------
gui-sell-title: "<dark_gray>Verkaufen"
gui-sell-info-name: "<gold><bold>Aktueller Wert"
gui-sell-info-lore:
  - "<gray>Verkaufbare Items: <white>{items}"
  - "<gray>Grundwert: <green>{base}"
  - "<gray>Multiplikator: <white>x{multiplier}"
  - "<gray>Du erhältst: <green><bold>{total}"
gui-sell-stats-name: "<aqua><bold>Dein Verkaufs-Level"
gui-sell-stats-lore:
  - "<gray>Level: <white>{level}"
  - "<gray>Multiplikator: <white>x{multiplier}"
  - "<gray>Verdient: <green>{earned}"
  - "<gray>Nächstes Level in: <green>{next}"
gui-sell-button-name: "<green><bold>Verkaufen"
gui-sell-button-lore:
  - "<gray>Klicke hier oder schließe das Menü,"
  - "<gray>um alle verkaufbaren Items zu verkaufen."
  - "<gray>Nicht verkaufbare Items bekommst du zurück."
gui-sell-cancel-name: "<red><bold>Abbrechen"
gui-sell-cancel-lore:
  - "<gray>Du bekommst alle Items zurück,"
  - "<gray>es wird nichts verkauft."
gui-next-max: "<gray>Maximales Level"

# ---------------- Verlauf /sellhistory ----------------
gui-history-title: "<dark_gray><underlined>Verkaufs-Verlauf"
gui-history-name: "<gold><bold>Verkauf <gray>(vor {time})"
gui-history-lore:
  - "<gray>Items: <white>{items}"
  - "<gray>Grundwert: <green>{base}"
  - "<gray>Multiplikator: <white>x{multiplier}"
  - "<gray>Erhalten: <green><bold>{payout}"
gui-history-empty: "<red><bold>Noch keine Verkäufe"

# ---------------- /sellmulti (alle Stufen) ----------------
gui-multi-title: "<dark_gray><underlined>Verkaufs-Stufen"
gui-multi-level-name: "<gold><bold>Stufe {level} <gray>(x{multiplier})"
gui-multi-level-lore:
  - "<gray>Multiplikator: <white>x{multiplier}"
  - "<gray>Benötigt: <green>{required}</green> <gray>durch Verkäufe verdient"
  - ""
gui-multi-status-reached: "<green>● Erreicht"
gui-multi-status-current: "<yellow>● Deine aktuelle Stufe"
gui-multi-status-locked: "<red>● Noch gesperrt"
gui-multi-remaining: "<gray>Noch <green>{remaining}</green> <gray>bis zur nächsten Stufe"
gui-multi-info-name: "<aqua><bold>Dein Fortschritt"
gui-multi-info-lore:
  - "<gray>Aktuelle Stufe: <white>{level}"
  - "<gray>Dein Multiplikator: <white>x{multiplier}"
  - "<gray>Insgesamt verdient: <green>{earned}"
