prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten."
reloaded: "{prefix}<green>SchiggyCrates wurde neu geladen (<white>{count}</white> Crates)."
usage: "{prefix}<gray>Benutzung: <white>/crate keys</white><gray>, <white>/crate history</white><gray>, <white>/crate preview [Crate]</white> <gray>und für Admins <white>/crate give|set|remove|list|reload"
unknown-crate: "{prefix}<red>Die Crate <white>{crate}</white> gibt es nicht. Vorhandene: <white>{crates}</white>"
player-unknown: "{prefix}<red>Der Spieler <white>{player}</white> ist unbekannt."
invalid-amount: "{prefix}<red>Die Anzahl muss eine Zahl zwischen 1 und 100000 sein."

no-key: "{prefix}<red>Du hast keinen Schlüssel für die {crate}<red>."
inventory-full: "{prefix}<red>Dein Inventar ist voll. Mach Platz, bevor du die Belohnung abholst."
claimed: "{prefix}<green>Du hast <white>{amount}x {reward}</white> <green>aus der {crate} <green>erhalten."
broadcast: "{prefix}<white>{player}</white> <gray>hat bei der {crate} <gray>gewählt: <white><bold>{reward}"

keys-header: "{prefix}<gold>Deine Schlüssel:"
keys-line: "<gray> - {crate}<gray>: <white>{amount}"
keys-none: "{prefix}<gray>Du hast keine Schlüssel."
keys-given: "{prefix}<gray><white>{player}</white> hat <white>{amount}</white> Schlüssel für {crate} <gray>erhalten."
keys-given-all: "{prefix}<gray><white>{count}</white> Spieler haben je <white>{amount}</white> Schlüssel für {crate} <gray>erhalten."
keys-received: "{prefix}<green>Du hast <white>{amount}</white> Schlüssel für {crate} <green>erhalten."

block-no-target: "{prefix}<red>Schau einen Block an (maximal 6 Blöcke entfernt)."
block-set: "{prefix}<green>Dieser Block ist jetzt eine <white>{crate}</white><green>-Crate."
block-removed: "{prefix}<gray>Crate entfernt."
block-none: "{prefix}<red>Dieser Block ist keine Crate."
list-header: "{prefix}<gold>Crates:"
list-line: "<gray> - <white>{id}</white> <dark_gray>({count} Belohnungen)"

history-header: "{prefix}<gold>Letzte Gewinne von <white>{player}</white><gold>:"
history-line: "<gray> - <white>{reward}</white> <dark_gray>({crate}, vor {time})"
history-empty: "{prefix}<gray>Noch keine Gewinne."

# ---------------- Menüs ----------------
gui-choose-title: "<dark_gray><underlined>{crate}"
gui-preview-title: "<dark_gray><underlined>{crate} <gray>(Vorschau)"
gui-choose-lore:
  - ""
  - "<yellow>Klicke, um diese Belohnung zu wählen"
gui-preview-lore:
  - ""
  - "<gray>Vorschau - öffne die Crate mit einem Schlüssel."
gui-keys-name: "<gold><bold>Deine Schlüssel"
gui-keys-lore:
  - "<gray>Für diese Crate: <white>{keys}"
gui-confirm-title: "<dark_gray><underlined>Belohnung bestätigen"
gui-confirm-name: "<green><bold>Bestätigen"
gui-confirm-lore:
  - "<gray>Belohnung: <white>{reward}"
  - "<gray>Dafür wird <white>1</white> Schlüssel verbraucht."
gui-all-name: "<gold><bold>Alle einlösen"
gui-all-lore:
  - "<gray>Belohnung <white>{count}x</white> abholen"
  - "<gray>Es werden <white>{count}</white> Schlüssel verbraucht,"
  - "<gray>solange dein Inventar Platz hat."
gui-cancel-name: "<red><bold>Zurück"
gui-cancel-lore:
  - "<gray>Zurück zur Auswahl."
