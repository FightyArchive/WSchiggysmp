price-removed: "{prefix}<gray>Preis von <white>{item}</white> <red>entfernt</red>."
price-not-set: "{prefix}<white>{item}</white> <red>hatte keinen Preis."
imported: "{prefix}<green>{count}</green> <gray>Preise aus der prices.yml importiert."

# ---------------- Preisliste /worth list ----------------
gui-worth-title: "<dark_gray>Preisliste <gray>({page}/{pages})"
gui-worth-item-name: "<white>{item}"
gui-worth-item-lore:
  - "<gray>Wert: <green>{price}</green> <gray>pro Stück"
  - "<gray>Stack: <green>{stack}"
gui-worth-prev-name: "<yellow><bold>Vorherige Seite"
gui-worth-next-name: "<yellow><bold>Nächste Seite"
gui-worth-info-name: "<gold><bold>Preisliste"
gui-worth-info-lore:
  - "<gray>Seite <white>{page}</white> von <white>{pages}"
  - "<gray>Items mit Preis: <white>{count}"
gui-close-name: "<red><bold>Schließen"

gui-worth-sort-name: "<aqua><bold>Sortierung"
gui-worth-sort-lore:
  - "<gray>Aktuell: <white>{sort}"
  - ""
  - "<yellow>Klicke zum Wechseln"
worth-sort-NAME: "Name (A-Z)"
worth-sort-WORTH_DESC: "Worth (höchster zuerst)"
worth-sort-WORTH_ASC: "Worth (niedrigster zuerst)"
