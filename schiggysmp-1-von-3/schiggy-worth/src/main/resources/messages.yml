prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Bitte melde das einem Admin."
hold-item: "{prefix}<red>Du musst ein Item in der Hand halten oder einen Item-Namen angeben."
unknown-item: "{prefix}<red>Unbekanntes Item: <white>{item}</white>"

worth-info: "{prefix}<white>{item}</white><gray>: <green>{price}</green> <gray>pro Stück <dark_gray>| <green>{stack}</green> <gray>pro Stack"
worth-hand: "{prefix}<gray>Dein Stack in der Hand (<white>{amount}x</white>): <green>{total}"
worth-none: "{prefix}<white>{item}</white> <red>hat keinen Verkaufswert."

usage-set: "{prefix}<gray>Benutzung: <white>/worth set [Preis]</white> <gray>oder <white>/worth set [Item] [Preis]"
usage-remove: "{prefix}<gray>Benutzung: <white>/worth remove [Item]"
invalid-price: "{prefix}<red>Ungültiger Preis. Beispiele: <white>10</white>, <white>2.5</white>, <white>1k</white>"
