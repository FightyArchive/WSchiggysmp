# SchiggyWorth
#
# Jedes Item, das es im Ueberlebensmodus gibt, ist verkaufbar. Items ohne eigenen Preis in der prices.yml
# (oder per /worth set) bekommen automatisch einen niedrigen Preis nach diesen Regeln.
# Dein eigener Preis hat immer Vorrang. Der Auto-Preis ist bewusst niedrig, damit sich Herstellen und
# Weiterverkaufen nicht lohnt.
auto-price:
  enabled: true
  # Preis pro Stueck, wenn kein Stichwort passt
  default: 0.25
  # Stichwoerter im Item-Namen. Der erste Treffer von oben nach unten gilt.
  keywords:
    NETHERITE: 500
    DIAMOND: 60
    EMERALD: 30
    GOLD: 8
    IRON: 4
    COPPER: 1.5
    LAPIS: 2
    AMETHYST: 3
    QUARTZ: 3
    OBSIDIAN: 10
    PRISMARINE: 2
    SHULKER: 40
    ELYTRA: 500
    TRIDENT: 400
    HEAD: 50
    SKULL: 50
    MUSIC_DISC: 30
    ENCHANTED: 100
    BEACON: 300
    CONDUIT: 300

# Diese Items sind nie verkaufbar (zusaetzlich zu allen reinen Creative-Items wie Bedrock oder Befehlsbloecken)
blocked: []
