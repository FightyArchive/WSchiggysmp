name: SchiggyWorth
version: '${project.version}'
main: de.schiggy.worth.SchiggyWorth
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore, SchiggyEconomy]
authors: [FightyFinn]
description: Zentrale Preisliste - zeigt den Verkaufswert von Items (/worth)
commands:
  worth:
    description: Zeigt den Verkaufswert von Items
    aliases: [wert]
permissions:
  schiggy.worth.use:
    description: /worth und die Preisliste benutzen
    default: true
  schiggy.worth.admin:
    description: Preise ändern, löschen und importieren
    default: op
