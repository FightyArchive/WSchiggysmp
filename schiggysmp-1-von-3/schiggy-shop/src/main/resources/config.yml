# SchiggyShop
#
# Preise sind pro Stueck in normalen Einheiten (Money darf Dezimalstellen haben, Gems sind ganze Zahlen).
# Aenderungen an dieser Datei uebernimmst du mit /shop reload.
#
# Eintraege unter "items":
#   material:     Item (z. B. DIAMOND_SWORD)
#   price:        Preis pro Stueck
#   currency:     money oder shards (Standard: money)
#   daily-limit:  Wie viele Stueck ein Spieler pro Tag (UTC) maximal kaufen darf (0 oder weglassen = unbegrenzt)
#   display-name: Eigener Anzeigename (MiniMessage), optional
#   commands:     Statt eines Items werden diese Konsolen-Befehle ausgefuehrt (z. B. fuer Crate-Schluessel).
#                 Platzhalter: {player} und {amount}. Das Material dient dann nur als Symbol.

menu:
  # Zeilen des Hauptmenues (1 bis 6)
  rows: 3

# Maximale Menge pro Kauf
max-purchase-amount: 576

