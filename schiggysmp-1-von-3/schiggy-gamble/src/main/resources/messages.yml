prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Dir wurde nichts berechnet."
usage: "{prefix}<gray>Benutzung: <white>/invest</white><gray>, <white>/invest [Betrag]</white> <gray>oder <white>/invest collect"

invalid-amount: "{prefix}<red>Ungültiger Betrag. Beispiele: <white>5000</white>, <white>25k</white>, <white>1m</white>"
amount-range: "{prefix}<red>Der Betrag muss zwischen <white>{min}</white> und <white>{max}</white> liegen."
too-many: "{prefix}<red>Du hast schon <white>{limit}</white> laufende Investitionen. Hole erst eine ab."
no-money: "{prefix}<red>Du hast nicht genug Geld. Du brauchst <white>{amount}</white>."
started: "{prefix}<green>Du hast <white>{amount}</white> <green>investiert. Abholbereit in <white>{time}</white><green>."
not-ready: "{prefix}<red>Diese Investition ist noch nicht fertig. Noch <white>{time}</white>."
nothing-ready: "{prefix}<gray>Es ist keine Investition abholbereit."
collect-profit: "{prefix}<green>Gewinn! <gray>Eingesetzt: <white>{amount}</white> <gray>- erhalten: <green>{payout}</green> <dark_gray>(x{multiplier})"
collect-loss: "{prefix}<red>Verlust. <gray>Eingesetzt: <white>{amount}</white> <gray>- erhalten: <red>{payout}</red> <dark_gray>(x{multiplier})"
collect-even: "{prefix}<gray>Null-Summe. Eingesetzt: <white>{amount}</white> <gray>- erhalten: <white>{payout}</white> <dark_gray>(x{multiplier})"

# ---------------- Menü ----------------
gui-title: "<dark_gray><underlined>Investieren"
gui-tier-name: "<gold><bold>{amount} investieren"
gui-tier-lore:
  - "<gray>Laufzeit: <white>{duration}"
  - "<gray>Das Ergebnis steht fest, bleibt aber"
  - "<gray>geheim, bis du es abholst."
  - ""
  - "<yellow>Klicke zum Investieren"
gui-running-name: "<yellow><bold>Läuft <gray>({amount})"
gui-running-lore:
  - "<gray>Eingesetzt: <white>{amount}"
  - "<gray>Fertig in: <white>{time}"
gui-ready-name: "<green><bold>Fertig <gray>({amount})"
gui-ready-lore:
  - "<gray>Eingesetzt: <white>{amount}"
  - ""
  - "<yellow>Klicke zum Abholen"
gui-info-name: "<aqua><bold>So funktioniert es"
gui-info-lore:
  - "<gray>Mögliche Ergebnisse:"
gui-info-outcome: "<gray> x{multiplier}: <white>{chance}%"
gui-info-footer:
  - ""
  - "<gray>Maximal <white>{limit}</white> Investitionen gleichzeitig."
