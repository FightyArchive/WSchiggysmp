prefix: "<gradient:#00aaff:#00ffff><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
players-only: "{prefix}<red>Dieser Befehl ist nur für Spieler."
error: "{prefix}<red>Es ist ein Fehler aufgetreten. Dir wurde nichts berechnet."
invalid-amount: "{prefix}<red>Ungültiger Betrag. Beispiele: <white>5000</white>, <white>25k</white>, <white>1m</white>"
amount-small: "{prefix}<red>Der kleinste Betrag ist <white>{min}</white>."
too-much: "{prefix}<red>Du darfst höchstens <white>{max}</white> investieren. Du hast schon <white>{current}</white> angelegt."
no-money: "{prefix}<red>Du hast nicht genug Geld. Du brauchst <white>{amount}</white>."
invested: "{prefix}<green>Du hast <white>{amount}</white> <green>investiert. Insgesamt angelegt: <white>{total}</white> <dark_gray>(+{income} pro Intervall)"
claimed: "{prefix}<green>Du hast <white>{amount}</white> <green>Einkommen abgeholt."
nothing-to-claim: "{prefix}<gray>Es gibt noch nichts abzuholen."
deleted: "{prefix}<green>Investment gelöscht. Zurückerhalten: <white>{amount}</white> <dark_gray>(Kapital {capital} + Einkommen {income})"
nothing-invested: "{prefix}<red>Du hast nichts investiert."
auto-on: "{prefix}<green>Automatisches Einsammeln ist jetzt <bold>an</bold><green>."
auto-off: "{prefix}<gray>Automatisches Einsammeln ist jetzt <bold>aus</bold><gray>."
amount-prompt: "{prefix}<gray>Schreibe den Betrag in den Chat. <dark_gray>(<white>cancel</white> zum Abbrechen)"
usage: "{prefix}<gray>Benutzung: <white>/invest</white><gray>, <white>/invest [Betrag]</white><gray>, <white>/claiminvest</white><gray>, <white>/deleteinvest</white> <gray>und <white>/autocollecttoggle"

# ---------------- Menü ----------------
gui-title: "<dark_gray><underlined>Investment"
gui-info-name: "<aqua><bold>Dein Investment"
gui-info-lore:
  - "<gray>Investiert: <white>{invested}"
  - "<gray>Kontostand: <green>{balance}"
  - "<gray>Erzeugt insgesamt: <green>{earned}"
  - "<gray>Abholbereit: <yellow>{pending}"
  - ""
  - "<gray>Zinssatz: <white>{rate}% pro Intervall"
  - "<gray>Intervall: <white>{interval}"
  - "<gray>Nächstes Einkommen in: <white>{next}"
  - "<gray>Maximum: <white>{max}"
gui-custom-name: "<gold><bold>Betrag eingeben"
gui-custom-lore:
  - "<gray>Schreibe einen beliebigen Betrag"
  - "<gray>in den Chat."
  - ""
  - "<yellow>Klicke zum Investieren"
gui-tier-name: "<gold><bold>{amount} investieren"
gui-tier-lore:
  - "<gray>Einkommen pro Intervall: <green>+{income}"
  - ""
  - "<yellow>Klicke zum Investieren"
gui-claim-name: "<green><bold>Einkommen abholen"
gui-claim-lore:
  - "<gray>Abholbereit: <yellow>{pending}"
gui-delete-name: "<red><bold>Investment löschen"
gui-delete-lore:
  - "<gray>Du bekommst dein Kapital <white>{invested}</white>"
  - "<gray>und das Einkommen <white>{pending}</white> zurück."
gui-auto-on-name: "<green><bold>Auto-Einsammeln: AN"
gui-auto-off-name: "<red><bold>Auto-Einsammeln: AUS"
gui-auto-lore:
  - "<gray>Das Einkommen wird automatisch"
  - "<gray>auf dein Konto überwiesen."
  - ""
  - "<yellow>Klicke zum Umschalten"

# ---------------- Admin ----------------
admin-usage:
  - "{prefix}<gold>/investadmin:"
  - "<gray> <white>set rate [Wert]</white> <dark_gray>- z. B. 0.001"
  - "<gray> <white>set interval [Ticks]</white> <dark_gray>- z. B. 20"
  - "<gray> <white>set max [Betrag]</white>"
  - "<gray> <white>view [Spieler]</white>"
  - "<gray> <white>reset [Spieler] [refund]</white> <dark_gray>- ohne refund wird nichts zurückgezahlt"
  - "<gray> <white>setearned [Spieler] [Betrag]</white>"
  - "<gray> <white>reload</white>"
admin-set: "{prefix}<green>{setting} ist jetzt <white>{value}</white><green>."
admin-invalid: "{prefix}<red>Ungültiger Wert."
admin-unknown-player: "{prefix}<red>Der Spieler <white>{player}</white> ist unbekannt."
admin-view-header: "{prefix}<gold>Investment von <white>{player}"
admin-view-line: "<gray> {label}: <white>{value}"
admin-reset: "{prefix}<gray>Investment von <white>{player}</white> zurückgesetzt. Zurückgezahlt: <white>{amount}"
admin-setearned: "{prefix}<gray>Erzeugte Einnahmen von <white>{player}</white> auf <white>{amount}</white> gesetzt."
reloaded: "{prefix}<green>SchiggyGamble wurde neu geladen."
label-invested: "Investiert"
label-pending: "Abholbereit"
label-earned: "Erzeugt insgesamt"
label-auto: "Auto-Einsammeln"
