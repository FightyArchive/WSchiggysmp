gui-status-lore:
  - "<gray>Angelegt: <white>{total}"
  - "<gray>Pro Sekunde: <green>+{income}"
  - "<gray>Pro Minute: <green>+{income_minute}"
  - "<gray>Rate: <white>{percent}% pro Sekunde"
gui-withdraw-all-name: "<red><bold>Alles abheben"
gui-withdraw-all-lore:
  - "<gray>Du bekommst <white>{total}</white> zurück."
gui-withdraw-half-name: "<yellow><bold>Die Hälfte abheben"
