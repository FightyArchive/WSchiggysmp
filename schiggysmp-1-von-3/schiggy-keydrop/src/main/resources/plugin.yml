name: SchiggyKeydrop
version: '${project.version}'
main: de.schiggy.keydrop.SchiggyKeydrop
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore, SchiggyCrates]
authors: [FightyFinn]
description: Serverweite Keydrop-Events - alle Online-Spieler bekommen Crate-Schlüssel
commands:
  keydrop:
    description: Keydrop starten, stoppen und ansehen
    aliases: [kd]
permissions:
  schiggy.keydrop.info:
    description: /keydrop info benutzen
    default: true
  schiggy.keydrop.receive:
    description: Bekommt die Schlüssel bei einem Keydrop
    default: true
  schiggy.keydrop.admin:
    description: Keydrops starten und stoppen, Admin-Menü, Reload
    default: op
