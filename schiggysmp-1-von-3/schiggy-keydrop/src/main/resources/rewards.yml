# SchiggyKeydrop - was bei einem Keydrop verteilt wird
#
# Jedes Preset ist ein Keydrop-Typ. keys = Crate-Name: Anzahl. Die Crate-Namen sind die Namen aus der
# config.yml von SchiggyCrates (z. B. common, amethyst, vote, rare, legendary).
# weight: So oft wird das Preset bei automatischen Keydrops gewaehlt (je hoeher, desto haeufiger).
# Manuell startest du ein Preset mit /keydrop start [Preset].
presets:
  standard:
    name: "<gold><bold>Standard-Keydrop"
    weight: 70
    keys:
      common: 3
      amethyst: 1

  mega:
    name: "<light_purple><bold>Mega-Keydrop"
    weight: 30
    keys:
      common: 6
      amethyst: 3
      legendary: 1
