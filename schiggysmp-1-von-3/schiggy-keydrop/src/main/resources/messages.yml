prefix: "<gradient:#ff5555:#ffaa00><bold>SchiggySMP</bold></gradient> <dark_gray>»</dark_gray> "

no-permission: "{prefix}<red>Dafür hast du keine Berechtigung."
usage: "{prefix}<gray>Benutzung: <white>/keydrop</white><gray>, <white>/keydrop start [Preset]</white><gray>, <white>/keydrop stop</white><gray>, <white>/keydrop info</white> <gray>oder <white>/keydrop reload"
reloaded: "{prefix}<green>SchiggyKeydrop wurde neu geladen (<white>{count}</white> Presets)."
unknown-preset: "{prefix}<red>Das Preset <white>{preset}</white> gibt es nicht. Vorhandene: <white>{presets}</white>"
no-presets: "{prefix}<red>Es sind keine Presets in der rewards.yml eingetragen."
already-running: "{prefix}<red>Es läuft schon ein Keydrop."
not-running: "{prefix}<red>Aktuell läuft kein Keydrop."
started: "{prefix}<green>Keydrop <white>{preset}</white> <green>gestartet."
stopped: "{prefix}<gray>Der Keydrop wurde von <white>{by}</white> <gray>gestoppt."
stopped-admin: "{prefix}<gray>Keydrop gestoppt."

# ---------------- Ankündigungen ----------------
announce-chat:
  - ""
  - "{prefix}<gold><bold>KEYDROP!</bold> <gray>{preset}"
  - "<gray>In <white>{seconds} Sekunden</white> <gray>bekommen alle Online-Spieler:"
  - "{keys}"
  - ""
announce-key-line: "<gray> - <white>{amount}x</white> {crate}"
title: "<gold><bold>KEYDROP</bold>"
subtitle: "<gray>In <white>{seconds}</white> Sekunden gibt es Schlüssel!"
countdown-chat: "{prefix}<gray>Keydrop in <white>{seconds}</white> Sekunden..."
countdown-actionbar: "<gold><bold>Keydrop</bold> <gray>in <white>{seconds}s"
countdown-title: "<gold><bold>{seconds}"
bossbar: "<gold><bold>Keydrop</bold> <gray>- {preset} <gray>in <white>{seconds}s"

# ---------------- Auszahlung ----------------
finish-chat: "{prefix}<green><bold>Keydrop!</bold> <gray>Alle <white>{players}</white> berechtigten Spieler haben ihre Schlüssel bekommen."
received-header: "{prefix}<green>Du hast beim Keydrop bekommen:"
received-line: "<gray> - <white>{amount}x</white> {crate}"
received-title: "<green><bold>Keydrop!</bold>"
received-subtitle: "<gray>Deine Schlüssel wurden gutgeschrieben."
not-eligible: "{prefix}<gray>Du warst für diesen Keydrop nicht berechtigt."

# ---------------- Info ----------------
info-idle: "{prefix}<gray>Aktuell läuft kein Keydrop."
info-running: "{prefix}<gold>Keydrop läuft: <white>{preset}</white> <gray>- noch <white>{seconds}s"
info-next-auto: "{prefix}<gray>Nächster automatischer Keydrop in <white>{time}</white><gray>."
info-auto-off: "{prefix}<gray>Automatische Keydrops sind ausgeschaltet."

# ---------------- Admin-Menü ----------------
gui-title: "<dark_gray><underlined>Keydrop"
gui-preset-name: "{name}"
gui-preset-lore:
  - "<gray>Das bekommen alle Online-Spieler:"
gui-preset-hint:
  - ""
  - "<yellow>Klicke, um diesen Keydrop zu starten"
gui-stop-name: "<red><bold>Keydrop stoppen"
gui-stop-lore:
  - "<gray>Bricht den laufenden Keydrop ab."
  - "<gray>Es werden keine Schlüssel verteilt."
gui-info-name: "<aqua><bold>Status"
gui-history-name: "<gold><bold>Letzte Keydrops"
gui-history-line: "<gray> - <white>{preset}</white> <dark_gray>({players} Spieler, vor {time}, {status})"
gui-history-empty: "<gray> Noch keine Keydrops."
status-PAID: "ausgezahlt"
status-CANCELLED: "abgebrochen"
