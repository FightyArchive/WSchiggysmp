# SchiggyKeydrop
#
# Ein Keydrop ist ein Event: Es startet (per Befehl oder automatisch), ein Countdown laeuft,
# und danach bekommen ALLE berechtigten Online-Spieler Crate-Schluessel.
# Die Schluessel gehen direkt in die Crates von SchiggyCrates (/crate keys zeigt sie an).
# Was es gibt, steht in der rewards.yml.

# Wie lange der Countdown vor der Auszahlung laeuft (Sekunden)
countdown-seconds: 60

# Bei diesen verbleibenden Sekunden gibt es eine Ansage im Chat bzw. einen Titel
milestones: [60, 30, 10, 5, 4, 3, 2, 1]

bossbar:
  color: YELLOW        # BLUE, GREEN, PINK, PURPLE, RED, WHITE, YELLOW
  overlay: PROGRESS    # PROGRESS, NOTCHED_6, NOTCHED_10, NOTCHED_12, NOTCHED_20

# Sounds (Minecraft-Sound-Namen)
sounds:
  start: "minecraft:entity.player.levelup"
  tick: "minecraft:ui.button.click"
  finish: "minecraft:entity.experience_orb.pickup"

# Wer dieses Recht hat, bekommt Schluessel (Standard: alle)
receive-permission: schiggy.keydrop.receive

# In diesen Welten bekommen Spieler keine Schluessel
blocked-worlds: []

# Automatische Keydrops
auto:
  enabled: true
  interval-minutes: 60
  # Es startet nur, wenn mindestens so viele Spieler online sind
  min-players: 1

# Wie viele vergangene Events im Admin-Menue gezeigt werden
history-size: 8
