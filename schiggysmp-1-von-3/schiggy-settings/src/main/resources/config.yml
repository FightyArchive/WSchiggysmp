# SchiggySettings

mob-spawning:
  # Wenn ein Spieler "Mob-Spawning" ausschaltet, spawnen im Umkreis von X Bloecken um ihn
  # keine natuerlichen Mobs mehr (Spawner und Spawn-Eier sind nicht betroffen).
  radius: 64

# Befehle fuer private Nachrichten. Hat der Empfaenger "Private Nachrichten" ausgeschaltet,
# wird die Nachricht blockiert (Teammitglieder mit schiggy.settings.bypass duerfen trotzdem schreiben).
private-message-commands:
  - msg
  - tell
  - w
  - whisper
  - m
  - t
  - pm
