# SchiggyHomes
# Home-Limits pro Rang ueber LuckPerms-Rechte: schiggy.homes.limit.<Anzahl>  (z. B. schiggy.homes.limit.5)
# Der hoechste passende Wert gilt. schiggy.homes.limit.unlimited = unbegrenzt.

# Limit fuer Spieler ohne eigenes Limit-Recht
default-limit: 3

# Loeschen erst nach Bestaetigung (Klick im Chat)
confirm-delete: true

# Welten, in denen keine Homes gesetzt werden duerfen (Weltnamen)
blocked-worlds: []

teleport:
  # Wartezeit in Sekunden, bei Bewegung wird abgebrochen (0 = sofort)
  warmup-seconds: 3
  # Cooldown nach einem erfolgreichen Teleport in Sekunden
  cooldown-seconds: 5
