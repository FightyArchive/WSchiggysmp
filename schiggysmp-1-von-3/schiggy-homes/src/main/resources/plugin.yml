name: SchiggyHomes
version: '${project.version}'
main: de.schiggy.homes.SchiggyHomes
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore]
authors: [FightyFinn]
description: Persönliche Teleportpunkte (/sethome, /home, /homes, /delhome)
commands:
  sethome:
    description: Setzt ein Home an deiner Position
  home:
    description: Teleportiert dich zu einem Home
  homes:
    description: Zeigt alle deine Homes
  delhome:
    description: Löscht ein Home
permissions:
  schiggy.homes.use:
    description: Homes benutzen
    default: true
  schiggy.homes.limit.unlimited:
    description: Unbegrenzt viele Homes
    default: op
  schiggy.homes.bypass-cooldown:
    description: Kein Cooldown beim Teleport zum Home
    default: op
  schiggy.homes.bypass-warmup:
    description: Keine Wartezeit beim Teleport zum Home
    default: op
