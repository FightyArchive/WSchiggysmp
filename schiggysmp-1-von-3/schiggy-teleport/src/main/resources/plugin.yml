name: SchiggyTeleport
version: '${project.version}'
main: de.schiggy.teleport.SchiggyTeleport
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore, SchiggySettings]
authors: [FightyFinn]
description: Teleportsystem mit /tpa, /tpahere, /tpaccept, /tpdeny und /rtp
commands:
  tpa:
    description: Bittet einen Spieler, sich zu ihm teleportieren zu dürfen
  tpahere:
    description: Bittet einen Spieler, sich zu dir zu teleportieren
  tpaccept:
    description: Nimmt eine Teleport-Anfrage an
    aliases: [tpyes]
  tpdeny:
    description: Lehnt eine Teleport-Anfrage ab
    aliases: [tpno]
  rtp:
    description: Teleportiert dich an einen zufälligen sicheren Ort
    aliases: [randomtp, wild]
permissions:
  schiggy.teleport.tpa:
    description: /tpa, /tpahere, /tpaccept und /tpdeny benutzen
    default: true
  schiggy.teleport.rtp:
    description: /rtp benutzen
    default: true
  schiggy.teleport.bypass-cooldown:
    description: Keine Cooldowns bei Teleport-Befehlen
    default: op
  schiggy.teleport.bypass-warmup:
    description: Keine Wartezeit vor dem Teleport
    default: op
