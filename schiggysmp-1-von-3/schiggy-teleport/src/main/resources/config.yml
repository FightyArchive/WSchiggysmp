# SchiggyTeleport

# Wie lange eine TPA-Anfrage gueltig ist (Sekunden)
request-timeout-seconds: 60
# Wartezeit, bevor man die naechste TPA-Anfrage senden darf (Sekunden)
request-cooldown-seconds: 10

# Beim Eingeben von /tpaccept ein Menue mit Kopf, Welt und Flug-Status zeigen
# (mit /tpaccept [Name] wird direkt angenommen)
accept-gui: true

# Anzeigenamen der Welten im Menue
world-names:
  world: "Oberwelt"
  world_nether: "Nether"
  world_the_end: "End"

tpa:
  # Wartezeit vor dem Teleport, bei Bewegung wird abgebrochen (0 = sofort)
  warmup-seconds: 3

rtp:
  # Mittelpunkt, um den zufaellige Orte gesucht werden
  center-x: 0
  center-z: 0
  warmup-seconds: 3
  cooldown-seconds: 60

  # Die drei Eintraege im /rtp-Menue. "world" ist der Name der Welt auf dem Server.
  # Zufallsort zwischen min-radius und max-radius (Bloecke), attempts = wie oft gesucht wird.
  # enabled: false blendet den Eintrag aus.
  worlds:
    overworld:
      enabled: true
      world: world
      min-radius: 250
      max-radius: 5000
      attempts: 15
    nether:
      enabled: true
      world: world_nether
      min-radius: 100
      max-radius: 1000
      attempts: 25
    end:
      enabled: true
      world: world_the_end
      # Standard: Hauptinsel. Fuer die Aussen-Inseln z. B. 1200 bis 3000 einstellen
      # (dort ist viel Leere, deshalb mehr Versuche noetig).
      min-radius: 10
      max-radius: 60
      attempts: 30
