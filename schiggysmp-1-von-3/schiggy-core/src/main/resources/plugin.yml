name: SchiggyCore
version: '${project.version}'
main: de.schiggy.core.SchiggyCore
api-version: '1.21'
folia-supported: true
authors: [FightyFinn]
description: Gemeinsame Grundlage aller Schiggy-Plugins (Datenbank, Nachrichten, GUI, Scheduler)
commands:
  schiggycore:
    description: Zeigt Infos zu SchiggyCore und den geladenen Schiggy-Plugins
    aliases: [fcore]
permissions:
  schiggy.core.admin:
    description: Zugriff auf /schiggycore
    default: op
