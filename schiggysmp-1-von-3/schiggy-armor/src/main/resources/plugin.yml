name: SchiggyArmor
version: '${project.version}'
main: de.schiggy.armor.SchiggyArmor
api-version: '1.21'
folia-supported: true
depend: [SchiggyCore]
authors: [FightyFinn]
description: Eigene Rüstungs-Sets mit Boni (Geschwindigkeit, Sprung, Regeneration und mehr)
commands:
  armor:
    description: Rüstungs-Sets verwalten (/armor give, /armor list, /armor reload)
    aliases: [fa]
permissions:
  schiggy.armor.admin:
    description: /armor benutzen
    default: op
